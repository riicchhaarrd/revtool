name: Build and Publish Web UI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

env:
  EMSDK_VERSION: "4.0.20"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten SDK
        run: |
          if [ ! -x emsdk/emsdk ]; then
            git clone https://github.com/emscripten-core/emsdk.git emsdk
          fi
          ./emsdk/emsdk install "$EMSDK_VERSION"
          ./emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Cache wasm dependencies
        uses: actions/cache@v4
        with:
          path: wasm_deps
          key: wasm-deps-${{ runner.os }}-${{ env.EMSDK_VERSION }}-${{ hashFiles('build_wasm.sh', 'wasm/CMakeLists.txt') }}

      - name: Build wasm bundle
        env:
          EMSDK_DIR: ${{ github.workspace }}/emsdk
        run: ./build_wasm.sh

      - name: Prepare web bundle
        run: |
          test -s web/index.html
          test -s web/dis.js
          test -s web/dis.wasm

      - name: Publish gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages --depth=1
            git worktree add gh-pages origin/gh-pages
          else
            git worktree add --detach gh-pages
            git -C gh-pages switch --orphan gh-pages
          fi
          find gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp web/index.html web/dis.js web/dis.wasm gh-pages/
          touch gh-pages/.nojekyll
          git -C gh-pages add -A
          if git -C gh-pages diff --cached --quiet; then
            echo "No changes to publish"
          else
            git -C gh-pages commit -m "deploy: update web UI"
            git -C gh-pages push origin HEAD:gh-pages
          fi
